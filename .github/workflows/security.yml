name: Security Pipeline (OSS)

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 🐍 Setup Python (for Semgrep)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 🔐 Install Semgrep
      - name: Install Semgrep
        run: pip install semgrep

      # 🔐 Run Semgrep (SAST)
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --error \
            --severity ERROR

      # 🔑 Secret scanning (Gitleaks)
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      # 📦 Dependency scanning (Trivy)
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          format: table
          exit-code: 1
          severity: CRITICAL   # only block on critical

      # 📊 Upload reports (optional)
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            ./
